<!DOCTYPE html>
<html>
<head>
    <title>AgentX UI</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
        }

        button {
            padding: 10px;
            margin-top: 10px;
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }

        textarea, input {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            box-sizing: border-box;
        }

        .output {
            margin-top: 10px;
            background: black;
            padding: 10px;
            border-radius: 5px;
            white-space: pre-wrap;
            min-height: 80px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 13px;
        }
    </style>
</head>

<body>

<h1>🤖 AgentX UI</h1>
<p style="text-align:center;color:#94a3b8;">Make sure the backend server is running on <strong>http://127.0.0.1:8000</strong></p>

<div class="container">

    <!-- EMAIL -->
    <div class="card">
        <h3>Email Automation</h3>
        <button id="emailBtn" onclick="runEmail()">Run</button>
        <div id="emailOut" class="output"></div>
    </div>

    <!-- MEETING -->
    <div class="card">
        <h3>Meeting Summarizer</h3>
        <textarea id="transcript" placeholder="Paste your meeting transcript here..."></textarea>
        <button id="meetingBtn" onclick="runMeeting()">Summarize</button>
        <div id="meetingOut" class="output"></div>
    </div>

    <!-- RESEARCH -->
    <div class="card">
        <h3>Research Copilot</h3>
        <input id="topic" placeholder="Enter research topic"/>
        <button id="researchBtn" onclick="runResearch()">Generate Research</button>
        <div id="researchOut" class="output"></div>
    </div>

    <!-- JOURNAL -->
    <div class="card">
        <h3>Journal AI</h3>
        <textarea id="journal" placeholder="Write your journal entry..."></textarea>
        <button id="journalBtn" onclick="runJournal()">Analyze Emotion</button>
        <div id="journalOut" class="output"></div>
    </div>

</div>

<script>

const BASE_URL = "http://127.0.0.1:8000"

function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    if (btn) btn.disabled = loading;
}

async function apiPost(endpoint, body) {
    const res = await fetch(`${BASE_URL}${endpoint}`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
    });
    if (!res.ok) {
        const text = await res.text();
        throw new Error(text || `HTTP ${res.status}`);
    }
    return res.json();
}

// ---------------- EMAIL ---------------- //

async function runEmail() {
    const out = document.getElementById("emailOut")
    setLoading("emailBtn", true)
    out.innerText = "🔍 Scanning emails..."

    try {
        const data = await apiPost("/scan-emails", {})
        out.innerText = JSON.stringify({
            scanned: data.scanned_count,
            emails_detected: data.detected_emails?.length || 0,
            upcoming_events: data.upcoming_events?.length || 0
        }, null, 2)
    } catch (e) {
        out.innerText = "⚠ Backend not reachable\n\nMake sure the FastAPI server is running on port 8000:\n  cd backend && uvicorn api:app --reload --port 8000"
    } finally {
        setLoading("emailBtn", false)
    }
}


// ---------------- MEETING ---------------- //

async function runMeeting() {
    const text = document.getElementById("transcript").value
    const out = document.getElementById("meetingOut")
    setLoading("meetingBtn", true)

    if (!text.trim()) {
        out.innerText = "⚠ Please enter a meeting transcript first."
        setLoading("meetingBtn", false)
        return
    }

    out.innerText = "Processing..."

    try {
        const data = await apiPost("/summarize", { transcript: text })
        out.innerText = JSON.stringify(data, null, 2)
    } catch (e) {
        out.innerText = "⚠ Backend not reachable\n\nMake sure the FastAPI server is running on port 8000:\n  cd backend && uvicorn api:app --reload --port 8000"
    } finally {
        setLoading("meetingBtn", false)
    }
}


// ---------------- RESEARCH ---------------- //

async function runResearch() {
    const topic = document.getElementById("topic").value
    const out = document.getElementById("researchOut")
    setLoading("researchBtn", true)

    if (!topic.trim()) {
        out.innerText = "⚠ Please enter a research topic first."
        setLoading("researchBtn", false)
        return
    }

    out.innerText = "Processing..."

    try {
        const data = await apiPost("/research", { topic })
        out.innerText = JSON.stringify(data, null, 2)
    } catch (e) {
        out.innerText = "⚠ Backend not reachable\n\nMake sure the FastAPI server is running on port 8000:\n  cd backend && uvicorn api:app --reload --port 8000"
    } finally {
        setLoading("researchBtn", false)
    }
}


// ---------------- JOURNAL ---------------- //

async function runJournal() {
    const entry = document.getElementById("journal").value
    const out = document.getElementById("journalOut")
    setLoading("journalBtn", true)

    if (!entry.trim()) {
        out.innerText = "⚠ Please write a journal entry first."
        setLoading("journalBtn", false)
        return
    }

    out.innerText = "Processing..."

    try {
        const data = await apiPost("/journal", { entry })
        out.innerText = JSON.stringify(data, null, 2)
    } catch (e) {
        out.innerText = "⚠ Backend not reachable\n\nMake sure the FastAPI server is running on port 8000:\n  cd backend && uvicorn api:app --reload --port 8000"
    } finally {
        setLoading("journalBtn", false)
    }
}

</script>

</body>
</html>
