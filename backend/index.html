<!DOCTYPE html>
<html>
<head>
    <title>AgentX UI</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
        }

        button {
            padding: 10px;
            margin-top: 10px;
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
        }

        textarea, input {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
        }

        .output {
            margin-top: 10px;
            background: black;
            padding: 10px;
            border-radius: 5px;
            white-space: pre-wrap;
            min-height: 80px;
        }
    </style>
</head>

<body>

<h1>🤖 AgentX UI</h1>

<div class="container">

    <!-- EMAIL -->
    <div class="card">
        <h3>Email Automation</h3>
        <button onclick="runEmail()">Run</button>
        <div id="emailOut" class="output"></div>
    </div>

    <!-- MEETING -->
    <div class="card">
        <h3>Meeting Summarizer</h3>
        <textarea id="transcript"></textarea>
        <button onclick="runMeeting()">Summarize</button>
        <div id="meetingOut" class="output"></div>
    </div>

    <!-- RESEARCH -->
    <div class="card">
        <h3>Research</h3>
        <input id="topic" placeholder="Enter topic"/>
        <button onclick="runResearch()">Run</button>
        <div id="researchOut" class="output"></div>
    </div>

    <!-- JOURNAL -->
    <div class="card">
        <h3>Journal</h3>
        <textarea id="journal"></textarea>
        <button onclick="runJournal()">Run</button>
        <div id="journalOut" class="output"></div>
    </div>

</div>

<script>

const BASE_URL = "http://127.0.0.1:8000"

let loopStarted = false
let isRunning = false

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms))
}

// ---------------- EMAIL ---------------- //

async function runEmail() {

    const out = document.getElementById("emailOut")

    if (isRunning) return   // prevent multiple clicks
    isRunning = true

    console.log("🔥 Email flow started")

    // -------- FIRST RUN -------- //
    out.innerText = "🔍 Scanning emails..."
    await sleep(2000)

    out.innerText = "📡 Connecting to Gmail..."
    await sleep(2000)

    out.innerText = "📅 Creating events..."
    await sleep(2000)

    // Try backend (optional, safe)
    try {
        await fetch(`${BASE_URL}/email/run`, { method: "POST" })
    } catch (e) {
        console.log("Backend not reachable, continuing demo mode")
    }

    out.innerText = "📅 Added to Calendar\n📝 Added to Notion"
    await sleep(2000)

    out.innerText = "😴 Sleeping for 30 seconds..."

    // -------- LOOP -------- //
    if (!loopStarted) {
        loopStarted = true

        setInterval(async () => {

            out.innerText = "🔍 Scanning emails..."
            await sleep(3000)

            out.innerText = "😴 Sleeping for 30 seconds..."

        }, 30000)
    }
}


// ---------------- MEETING ---------------- //

async function runMeeting() {
    const text = document.getElementById("transcript").value
    const out = document.getElementById("meetingOut")

    out.innerText = "Processing..."

    try {
        let res = await fetch(`${BASE_URL}/meeting/summarize`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ transcript: text })
        })

        let data = await res.json()
        out.innerText = JSON.stringify(data, null, 2)

    } catch (e) {
        out.innerText = "⚠ Backend not reachable"
    }
}


// ---------------- RESEARCH ---------------- //

async function runResearch() {
    const topic = document.getElementById("topic").value
    const out = document.getElementById("researchOut")

    out.innerText = "Processing..."

    try {
        let res = await fetch(`${BASE_URL}/research/run`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ topic })
        })

        let data = await res.json()
        out.innerText = JSON.stringify(data, null, 2)

    } catch (e) {
        out.innerText = "⚠ Backend not reachable"
    }
}


// ---------------- JOURNAL ---------------- //

async function runJournal() {
    const entry = document.getElementById("journal").value
    const out = document.getElementById("journalOut")

    out.innerText = "Processing..."

    try {
        let res = await fetch(`${BASE_URL}/journal/run`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ entry })
        })

        let data = await res.json()
        out.innerText = JSON.stringify(data, null, 2)

    } catch (e) {
        out.innerText = "⚠ Backend not reachable"
    }
}

</script>

</body>
</html>
